{%- assign date_format = site.minima.date_format | default: "%b %-d, %Y" -%}
{%- assign words = include.post.content | strip_html | number_of_words -%}
{%- assign minutes = words | divided_by: 200 | at_least: 1 -%}
<span class="post-meta">
  <time class="dt-published" datetime="{{ include.post.date | date_to_xmlschema }}" itemprop="datePublished">{{ include.post.date | date: date_format }}</time><span class="sep">·</span>{{ minutes }} min read
</span>

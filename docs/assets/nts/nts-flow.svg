<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6cb6ff"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7a59"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="440" fill="#0d1117"/>

  <!-- actors -->
  <rect x="20" y="20" width="170" height="400" rx="8" fill="#161b22" stroke="#2a313c" stroke-width="2"/>
  <text x="105" y="48" fill="#f0f4f8" font-size="15" font-weight="600" text-anchor="middle">ESP32</text>
  <text x="105" y="68" fill="#8b949e" font-size="12" text-anchor="middle">clock says 1970</text>

  <rect x="690" y="20" width="190" height="180" rx="8" fill="#161b22" stroke="#2a313c" stroke-width="2"/>
  <text x="785" y="48" fill="#f0f4f8" font-size="15" font-weight="600" text-anchor="middle">Key server</text>
  <text x="785" y="68" fill="#8b949e" font-size="12" text-anchor="middle">port 4460</text>
  <text x="785" y="86" fill="#8b949e" font-size="12" text-anchor="middle">TCP, TLS 1.3</text>

  <rect x="690" y="240" width="190" height="180" rx="8" fill="#161b22" stroke="#2a313c" stroke-width="2"/>
  <text x="785" y="268" fill="#f0f4f8" font-size="15" font-weight="600" text-anchor="middle">Time server</text>
  <text x="785" y="288" fill="#8b949e" font-size="12" text-anchor="middle">port 123</text>
  <text x="785" y="306" fill="#8b949e" font-size="12" text-anchor="middle">UDP</text>

  <!-- phase 1 -->
  <text x="210" y="40" fill="#6cb6ff" font-size="14" font-weight="600">Step 1 · Key establishment (once)</text>
  <line x1="190" y1="72" x2="688" y2="72" stroke="#6cb6ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="210" y="64" fill="#d6dde6">TLS 1.3 handshake, certificate checked, ALPN "ntske/1"</text>
  <line x1="190" y1="112" x2="688" y2="112" stroke="#6cb6ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="210" y="104" fill="#d6dde6">"I speak NTPv4. I support these ciphers."</text>
  <line x1="688" y1="152" x2="192" y2="152" stroke="#6cb6ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="210" y="144" fill="#d6dde6">cipher choice, time server name, 8 cookies</text>
  <text x="210" y="184" fill="#8b949e" font-size="12">Both sides derive two keys from the TLS session. The keys never travel on the wire.</text>

  <line x1="200" y1="216" x2="680" y2="216" stroke="#2a313c" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- phase 2 -->
  <text x="210" y="252" fill="#ff7a59" font-size="14" font-weight="600">Step 2 · Authenticated time (every poll)</text>
  <line x1="190" y1="292" x2="688" y2="292" stroke="#ff7a59" stroke-width="2" marker-end="url(#b)"/>
  <text x="210" y="284" fill="#d6dde6">NTP request + unique ID + 1 cookie + seal</text>
  <line x1="688" y1="342" x2="192" y2="342" stroke="#ff7a59" stroke-width="2" marker-end="url(#b)"/>
  <text x="210" y="334" fill="#d6dde6">NTP reply + same unique ID + seal (1 fresh cookie inside)</text>
  <text x="210" y="376" fill="#8b949e" font-size="12">The device checks the seal first. Only then does it read the time.</text>
  <text x="210" y="396" fill="#8b949e" font-size="12">A reply without a valid seal is ignored, as if it never arrived.</text>
</svg>

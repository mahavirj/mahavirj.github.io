<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6cb6ff"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#0d1117"/>

  <text x="20" y="28" fill="#f0f4f8" font-size="15" font-weight="600">What the attacker's server sends</text>
  <text x="20" y="262" fill="#f0f4f8" font-size="15" font-weight="600">What the ESP32 checks</text>

  <!-- card 1: forged website certificate -->
  <rect x="20" y="48" width="250" height="118" rx="8" fill="#161b22" stroke="#ff7a59" stroke-width="2"/>
  <text x="32" y="70" fill="#8b949e" font-size="12">1 · Server certificate</text>
  <text x="32" y="92" fill="#f0f4f8" font-size="14" font-weight="600">ota.example.com</text>
  <text x="32" y="114" fill="#d6dde6">issuer: EM DV TLS CA - G3B</text>
  <text x="32" y="136" fill="#ff7a59" font-weight="600">signed with the LEAKED key</text>
  <text x="32" y="156" fill="#8b949e" font-size="12">made by the attacker, today</text>

  <!-- card 2: intermediate -->
  <rect x="325" y="48" width="250" height="118" rx="8" fill="#161b22" stroke="#2a313c" stroke-width="2"/>
  <text x="337" y="70" fill="#8b949e" font-size="12">2 · Intermediate certificate</text>
  <text x="337" y="92" fill="#f0f4f8" font-size="14" font-weight="600">EM DV TLS CA - G3B</text>
  <text x="337" y="114" fill="#d6dde6">issuer: emSign Root TLS CA - G3</text>
  <text x="337" y="136" fill="#d6dde6">genuine, signed by eMudhra in 2025</text>
  <text x="337" y="156" fill="#f85149" font-size="12" font-weight="600">REVOKED 18 Oct 2026 · key is public</text>

  <!-- card 3: root TLS CA -->
  <rect x="630" y="48" width="250" height="118" rx="8" fill="#161b22" stroke="#2a313c" stroke-width="2"/>
  <text x="642" y="70" fill="#8b949e" font-size="12">3 · Intermediate certificate</text>
  <text x="642" y="92" fill="#f0f4f8" font-size="14" font-weight="600">emSign Root TLS CA - G3</text>
  <text x="642" y="114" fill="#d6dde6">issuer: emSign ECC Root CA - G3</text>
  <text x="642" y="136" fill="#d6dde6">genuine, signed by eMudhra</text>
  <text x="642" y="156" fill="#8b949e" font-size="12">public, downloadable by anyone</text>

  <!-- arrows: each certificate points to its issuer -->
  <text x="297" y="100" fill="#8b949e" font-size="11" text-anchor="middle">issued by</text>
  <line x1="272" y1="112" x2="322" y2="112" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="602" y="100" fill="#8b949e" font-size="11" text-anchor="middle">issued by</text>
  <line x1="577" y1="112" x2="627" y2="112" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- device trust store -->
  <line x1="755" y1="168" x2="755" y2="194" stroke="#6cb6ff" stroke-width="2" marker-end="url(#arrowblue)"/>
  <text x="745" y="186" fill="#6cb6ff" font-size="11" text-anchor="end">issuer name looked up in</text>
  <rect x="590" y="196" width="290" height="46" rx="8" fill="#1c2230" stroke="#6cb6ff" stroke-width="2"/>
  <text x="602" y="214" fill="#8b949e" font-size="12">Device trust store, built into the firmware</text>
  <text x="602" y="233" fill="#f0f4f8" font-size="14" font-weight="600">emSign ECC Root CA - G3   ✓ found</text>

  <!-- checks -->
  <g fill="#3fb950" font-weight="600" font-size="14">
    <text x="20" y="292">✓ Check 1: did cert 2 really sign cert 1?</text>
    <text x="20" y="316">✓ Check 2: did cert 3 really sign cert 2?</text>
    <text x="20" y="340">✓ Check 3: did a trusted root sign cert 3?</text>
  </g>
  <g fill="#8b949e">
    <text x="420" y="292">yes: the leaked key is still a valid key</text>
    <text x="420" y="316">yes: eMudhra really signed it in 2025</text>
    <text x="420" y="340">yes: the root is on the firmware's list</text>
  </g>

  <!-- the missing check -->
  <rect x="20" y="364" width="860" height="88" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="36" y="392" fill="#f85149" font-weight="600" font-size="15">✗ The check that never happens: "has cert 2 been cancelled?"</text>
  <text x="36" y="416" fill="#d6dde6" font-size="14">A browser asks its revocation list (OneCRL, CRLSets) and stops here. The ESP32 has no such list,</text>
  <text x="36" y="436" fill="#d6dde6" font-size="14">no way to fetch one, and nothing to compare against. Result: "Certificate validated". That's bad.</text>
</svg>
